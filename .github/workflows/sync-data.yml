name: Sync gacha data

on:
  repository_dispatch:
    types: [data-updated]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Show dispatch payload
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: echo "$PAYLOAD"

      - name: Checkout ss-data
        uses: actions/checkout@v7.0.1
        with:
          repository: MakoStar/ss-data
          path: .data/ss-data
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 22

      - name: Generate data
        run: node scripts/sync-data.js

      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain public/data/gacha-data.json)" ]; then
            echo "data unchanged, skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/gacha-data.json
          git commit -m "chore(data): sync gacha data snapshot"
          git push
